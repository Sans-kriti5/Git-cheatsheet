<!Doctype html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Init Sheet</title>
    <link rel="stylesheet" href="style.css">
</head><div id="overall">
<body>
<H1>Git Init Sheet</H1>
    <div id="box">
        <H2>Commands</H2>
        <ul>
        <li>git init</li>
        <li>git add .</li>
        <li>git commit -m "first commit"</li>
        <li>git branch -M main</li>
        <li>git remote add origin <repository-url></li></ul></div>
<br><hr>
<H1>Git Branch Sheet</H1>
    <div id="box">
        <H2>Commands</H2>
        <ul>
        <li>git branch</li>
        <li>git branch -M <new-branch-name></li>
        <li>git checkout <branch-name></li>
        <li>git checkout -b <new-branch-name></li>
        <li>git branch -d <branch-name></li></ul></div>
<br><hr>
<p class="description">This is the webpage for the Git Command Sheet.</p></div>
</body>
</html>
